[project]
name = "project-docs"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = ["zensical==0.0.73"]
host = [
    "bleak>=1.0; sys_platform == 'darwin'",
    "mido>=1.3.3",
    "pillow>=13.0.0",
    "python-rtmidi>=1.5.8",
    "pytest>=8.0",
]
fw = [
    "mido>=1.3.3",
    "pillow>=13.0.0",
    "python-rtmidi>=1.5.8",
]

[tool.uv]
package = false
# fm1-base's font generator needs Pillow with libraqm (OpenType features);
# the macOS wheels are built without it, so build Pillow from source against
# Homebrew's libraqm (`brew install libraqm`).
no-binary-package = ["pillow"]

[tool.pyright]
extraPaths = ["host"]

[tool.pytest.ini_options]
testpaths = ["host/tests"]
pythonpath = ["host"]
