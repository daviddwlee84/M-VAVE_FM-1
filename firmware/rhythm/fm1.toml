# RHYTHM's build settings (fm1-base tools/build.py)
name = "RHYTHM"
title = "RHYTHM"
id_prefix = "FM-1_54"          # package identity: dev FM-1_5400, release 0.1 FM-1_54000100 (not in the Hub's catalog of 2026-11-18 12:01 UTC; 52 is RemoteFM1, JAMTRACK, QUADRO)
usb_manufacturer = "fm1-base"
usb_product = "RHYTHM FM-1"
o2 = []
include = ["../common"]        # ledfx (firmware/common, MIT)
words = "words.tsv"
ble = false                    # USB only for now
tagline = "a pocket rhythm trainer"
repo = "https://github.com/daviddwlee84/M-VAVE_FM-1"
site = "https://daviddwlee84.github.io/M-VAVE_FM-1/dev/rhythm/"
licence = "GPL-3.0-or-later"
credits = "Built on fm1-base by Charles Vestal. The hints follow fm1-morse's RHYTHM drill."
author = "daviddwlee84"
description = "A pocket rhythm trainer. METRO: metronome with subdivisions, tap tempo and a gap click. ECHO: hear a bar or two, tap it back, see every note early or late in ms with a hint. ENDLESS: call and response that speeds up. PULSE: keep the beat with no click and see your tempo, drift, jitter and error spread. JUDGE: faster or slower, rushing or dragging, by ear; a staircase finds your threshold. QUIZ: Italian tempo markings and their BPM, tempo changes, meters by ear."
tags = ["utility"]
