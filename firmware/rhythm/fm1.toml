credits = "Built on fm1-base by Charles Vestal. The hints follow fm1-morse's RHYTHM drill."
author = "daviddwlee84"
description = "A pocket rhythm trainer. METRO: a metronome with subdivisions, tap tempo and a gap click that goes quiet for a few bars to test your inner clock. ECHO: after a count-in, hear a bar or two of rhythm, tap it back on any key, and see every note early or late in milliseconds, with a hint for what to fix: rushing, dragging, late after rests, uneven sixteenths, squared syncopation."
tags = ["utility"]
