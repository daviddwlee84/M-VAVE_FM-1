# DRUMS' build settings (fm1-base tools/build.py)
name = "DRUMS"
title = "DRUMS"
id_prefix = "FM-1_58"          # package identity: dev FM-1_5800, release 0.1 FM-1_58000100 (no other package's in the Hub's catalog of 2026-11-19)
usb_manufacturer = "fm1-base"
usb_product = "DRUMS FM-1"
o2 = ["kit.c"]                 # the drum voices, at -O2
include = ["../common"]        # ledfx (firmware/common, MIT)
words = "words.tsv"
ble = false                    # USB only for now
tagline = "a live drum machine to jam with"
repo = "https://github.com/daviddwlee84/M-VAVE_FM-1"
site = "https://daviddwlee84.github.io/M-VAVE_FM-1/dev/drums/"
licence = "GPL-3.0-or-later"
credits = "Built on fm1-base by Charles Vestal. The transport follows this repository's RHYTHM. The RUSTY kit is from Karoryfer Samples' Big Rusty Drums (CC0-1.0)."
author = "daviddwlee84"
description = "A drum machine to play along with, not to program. Pick a style (rock, pop, funk, shuffle, disco, hip-hop, bossa, reggae, waltz, 6/8) and a kit (808, STUDIO, or the recorded RUSTY), press PLAY and steer it live: four MAINs, fills of half a bar, one or two bars that land now, next bar or at the phrase's end, a tom fill, intro, break, stop-time and ending on the left keys. REC: tap for a fill, hold for the next MAIN, tap twice to end. The right keys are pads; SEL and a pad mutes a drum; the MIX page sets each drum's level."
tags = ["drum-machine"]
